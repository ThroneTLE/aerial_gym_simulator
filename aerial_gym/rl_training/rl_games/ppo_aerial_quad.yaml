params:
  seed: 8
  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  load_checkpoint: False

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: False  # checkpoint 中无 sigma 参数，关闭固定 logstd 以避免缺键
    mlp:
      units: [256, 256, 128]  # 对齐 checkpoint 的更宽层
      d2rl: False
      activation: elu
      initializer:
        name: default
        scale: 2
    rnn:
      name: gru
      units: 64  # 对齐 checkpoint：weight_ih size 192x128 => hidden_size=64
      layers: 1
      before_mlp: False
      layer_norm: True  # layer_norm 权重/偏置维度 64

  config:
    env_name: payload_compensation_task      # 或 payload_compensation_task_full_rl
    env_config:
      num_envs: 2048
      headless: True

    name: gen_ppo
    reward_shaper:
      scale_value: 1.0

    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    ppo: True
    learning_rate: 5e-5
    lr_schedule: adaptive
    kl_threshold: 0.016
    save_best_after: 10
    score_to_win: 100000
    grad_norm: 1.0
    entropy_coef: 0.0001
    truncate_grads: True
    e_clip: 0.2
    clip_value: False
    num_actors: 2048
    horizon_length: 128
    minibatch_size: 65536
    mini_epochs: 6
    critic_coef: 2
    normalize_input: True  # checkpoint 包含 running_mean_std
    bounds_loss_coef: 0.0001
    max_epochs: 160000
    normalize_value: True
    use_diagnostics: True
    value_bootstrap: True
    use_smooth_clamp: False

    player:
      render: False
      deterministic: True
      games_num: 100000

params:
  seed: 8  # 训练随机种子（>0 生效，控制初始化/采样顺序，便于复现实验）
  algo:
    name: a2c_continuous_aux  # 使用带辅助损失的自定义 A2C Agent

  model:
    name: continuous_a2c_logstd  # 连续动作模型，策略输出均值+可学习 logstd

  load_checkpoint: False  # 是否从已有 checkpoint 恢复（True 时需指定路径）

  network:
    name: privileged_actor_critic  # 特权编码器 + 策略/价值双头网络
    separate: False  # False=共享主干；True=actor/critic 各自独立主干（更耗显存，梯度解耦）
    privileged_dim: 7  # 特权向量长度
    privileged_embed: 8  # 编码后维度
    privileged_hidden: 128  # 编码器隐层宽度
    aux_target_dim: 5  # 辅助损失目标维度: [mass, com_x, com_y, com_z, released_mass]
    aux_loss_weight: 1.0  # 辅助损失权重（网络内部）
    use_oracle_mode: True  # True=输入真实特权值(Teacher)，False=输入aux decoder预测值(Student)
    space:
      continuous:
        mu_activation: None  # 动作均值激活（None=线性输出，利于外部限幅）
        sigma_activation: None  # logstd 激活（通常保持线性，方便直接学习 logstd）
        mu_init:
          name: default  # 均值初始化方式（rl-games 内置）
        sigma_init:
          name: const_initializer  # logstd 初始化方式
          val: -10.0  # 初始 logstd 常数（log 标度；-2 ≈ std 0.135）
        fixed_sigma: True  # 启用可学习 logstd
        min_logstd: -10.0  # clamp 下限（约 std 0.018），防止过度收紧
        max_logstd: -6.0   # clamp 上限（约 std 2.72），防止噪声无上限飙升
    mlp:
      units: [256, 256, 128]  # MLP 隐层宽度（逐层）
      d2rl: False  # 是否使用 D2RL 结构（在输入拼接上一层输出，通常可提升稳定性但加大计算）
      activation: elu  # 隐层激活函数（ELU）
      initializer:
        name: default  # 权重初始化方案（rl-games 内置，Xavier 类）
        scale: 2  # 初始化缩放系数（越大初始方差越大）

  config:
    env_name: payload_compensation_task_teacher      # 任务名
    env_config:
      num_envs: 2048  # 并行环境数量（决定一次采样的宽度）
      headless: True  # 关闭渲染

    name: teacher_aux  # 实验名称（日志/ckpt 前缀）
    reward_shaper:
      scale_value: 0.1  # 全局奖励缩放，减小梯度/价值量级（过大易爆，过小学得慢）

    normalize_advantage: True  # 归一化 advantage（降低方差）
    gamma: 0.99  # 折扣因子（越小越短视）
    tau: 0.95  # GAE 衰减（越小 bias 高/variance 低）
    ppo: True  # 开启 PPO 裁剪模式
    learning_rate: 3e-4  # 初始学习率 - 降低到 1e-4 防止 NaN
    lr_schedule: adaptive  # 基于 KL 的自适应 LR 调度
    kl_threshold: 0.01  # KL 超过阈值会降低 LR/回滚（越小越保守，clip_frac/KL 尖峰更少但收敛慢）
    save_best_after: 1  # 从第 N 个 epoch 后开始记录最佳
    save_frequency: 1  # 每隔多少个 epoch 额外保存一次 checkpoint，便于事后挑选最小 imitation/err
    score_to_win: 100000000  # 达到该分数视为"成功"停止条件
    grad_norm: 0.5  # 全局梯度裁剪范数上限（从1.0降低到0.5，更严格防止梯度爆炸）
    entropy_coef: 0.001000  # 熵系数（鼓励探索，防止过早收敛；过大动作噪声重，过小易收敛到尖锐策略）
    truncate_grads: True  # 是否截断梯度（RNN 训练时常开，避免反向过长）
    e_clip: 0.0  # PPO 裁剪范围（从0.2降低到0.15，更保守的策略更新，提升稳定性）
    clip_value: True  # 是否对 value 也做裁剪 - 启用防止 value 爆炸
    num_actors: 2048  # 参与采样的环境/actor 数
    horizon_length: 256  # 每个 actor 收集的 rollout 长度 - 从 32 增加到 256
    minibatch_size: 131072  # 单次优化用的样本数（越大梯度方差低但显存/时间更高）
    mini_epochs: 3  # 每批数据重复训练次数（从4降低到3，减少过拟合和NaN风险）
    # 扰动样本优势加权（权重=1+coef*mask，mask 来自 infos['is_disturbance']）
    disturbance_adv_weight: 0.0
    # BC/DAgger 模仿损失系数（从 bc_coef 衰减到 bc_min_coef，乘 bc_alpha）
    bc_coef: 10.0
    bc_alpha: 1.0
    bc_min_coef: 0.4
    critic_coef: 0.5  # 价值损失权重（相对策略损失；大则稳定优势但可能拖慢策略更新）
    normalize_input: True  # base obs 用 running_mean_std；privileged_obs 用固定归一化（见 AERIAL_FIXED_OBS_NORM）
    bounds_loss_coef: 0.000  # 动作越界惩罚系数（动作超出 [-1,1] 时的惩罚强度）
    max_epochs: 16000  # 最大训练 epoch 数（训练上限）
    normalize_value: True  # 对 value 做 running_mean_std 归一化（减小价值尺度漂移）
    use_diagnostics: True  # 输出诊断指标到日志（TB/文本）
    value_bootstrap: True  # 终止时是否用 value 做 bootstrap（True 可减小方差，但对非终止型截断需注意偏差）
    use_smooth_clamp: False  # 是否对 value 误差做平滑截断（防止 value_loss 尖峰）
    
    # 辅助损失系数（在 A2CAgentWithAuxLoss 中使用）
    aux_loss_coef: 1.0  # 辅助损失权重
    
    # PINN (Physics-Informed) Loss: 强制策略输出符合物理公式
    # PINN 与 BC 共享 bc_coef 权重
    use_pinn_loss: True  # 启用 PINN 损失
    pinn_thrust_limit: 2.5  # 匹配 controller_config (2.5 N)
    pinn_torque_limits: [0.4, 0.4]  # 匹配 controller_config [roll, pitch] (0.4, 0.4 N·m)
    
    # === NaN Prevention & Numerical Stability ===
    # 奖励裁剪范围（已禁用 - 设为极大值以允许奖励自然增长）
    reward_clip_min: -1000000.0
    reward_clip_max: 1000000.0
    
    # 观测归一化后的裁剪范围（防止极端观测值）
    obs_clip_range: 10.0
    
    # NaN 检测间隔（每 N 步检查观测/梯度中的 NaN）
    nan_detection_interval: 100
    
    # 物理合理性限制（已禁用 - 设为极大值以消除警告）
    physical_velocity_limit: 1000000.0  # m/s
    physical_angvel_limit: 1000000.0     # rad/s
    
    # 梯度 NaN 处理（在训练器中实现）
    skip_nan_gradients: True  # 跳过包含 NaN 的梯度更新
    reset_optimizer_on_persistent_nan: True  # 连续 NaN 时重置优化器状态
    nan_tolerance: 5  # 允许的连续 NaN 跳过次数

    player:
      render: False  # 测试/推理是否渲染
      deterministic: True  # 测试时是否去掉探索噪声（True=使用均值动作）
      games_num: 100000  # 评估局数上限（rl-games 需要的占位）
